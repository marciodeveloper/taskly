services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: taskly
      POSTGRES_USER: taskly
      POSTGRES_PASSWORD: taskly
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskly -d taskly"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: ../../docker/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      APP_NAME: Taskly
      APP_URL: http://127.0.0.1:18000
      APP_LOCALE: pt_BR
      APP_FALLBACK_LOCALE: en
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: taskly
      DB_USERNAME: taskly
      DB_PASSWORD: taskly
      SANCTUM_STATEFUL_DOMAINS: 127.0.0.1:3000,localhost:3000
      FRONTEND_URL: http://127.0.0.1:3000
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: no-reply@taskly.local
      MAIL_FROM_NAME: Taskly
    volumes:
      - ./apps/api:/var/www/html
      - api_vendor:/var/www/html/vendor
    ports:
      - "127.0.0.1:18000:8000"

  # Development-only mail catcher. Never part of a production deployment.
  mailpit:
    image: axllent/mailpit:v1.21
    environment:
      MP_MAX_MESSAGES: 200
    ports:
      # Web UI. SMTP is also published so a natively-run Laravel can reuse it.
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  web:
    build:
      context: ./apps/web
      dockerfile: ../../docker/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:18000
      API_INTERNAL_URL: http://api:8000
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres_data:
  api_vendor:
  web_node_modules: